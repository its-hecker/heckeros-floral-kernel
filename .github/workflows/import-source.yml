name: Import verified PixelOS kernel snapshot
on:
  push:
    paths: [.github/workflows/import-source.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
      - name: Import the exact source tree once
        env:
          SOURCE_SHA: aaaa03e40200825133d21402cad8f2a86939a778
        run: |
          set -euo pipefail
          if git cat-file -e HEAD:UPSTREAM_SOURCE.json 2>/dev/null; then
            echo "Source already imported; no changes made."
            exit 0
          fi
          git fetch --no-tags --depth=1 https://github.com/its-hecker/infinity_cnb_kernel_google_msm-4.14.git "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          cp .github/workflows/import-source.yml /tmp/hecker-import-source.yml
          git read-tree --reset "$SOURCE_SHA^{tree}"
          mkdir -p .github/workflows
          cp /tmp/hecker-import-source.yml .github/workflows/import-source.yml
          cat > UPSTREAM_SOURCE.json <<'ORIGIN'
          {
            "repository": "its-hecker/infinity_cnb_kernel_google_msm-4.14",
            "revision": "aaaa03e40200825133d21402cad8f2a86939a778",
            "import": "Exact Git tree snapshot; original file modes, symlinks and submodule pins retained",
            "target": "coral",
            "rom_features": "Owned by its-hecker/HeckerOS, not this hardware repository"
          }
          ORIGIN
          git add .github/workflows/import-source.yml UPSTREAM_SOURCE.json
          git -c user.name='HeckerOS source import' -c user.email='source-import@heckeros.local' commit -m 'Import pinned PixelOS coral kernel sources for HeckerOS'
          git push origin HEAD:main
